# The gate for every change. CLAUDE.md still asks for `pytest` locally first -
# this is what stops an unrun suite reaching master, not a substitute for it.
#
# Action versions are pinned to a commit SHA rather than a tag: a tag is
# mutable, and `release.yml` hands one of these actions an OIDC token that can
# publish to PyPI. Refresh a pin with
#   git ls-remote --tags https://github.com/<owner>/<repo> | grep <tag>
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Nothing here writes anything. The only write permissions in the repository
# live in release.yml, on the two jobs that need them.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    # Windows runners default to PowerShell; one shell everywhere means one
    # set of quoting rules to get right.
    shell: bash

env:
  FORCE_COLOR: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  format:
    name: black
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      # Pinned exactly, not to the `>=24.3` floor in pyproject.toml: Black's
      # stable style changes between releases, so a floating version turns
      # somebody else's release into a red build here. Bump it deliberately,
      # and reformat in the same commit.
      - run: pip install black==26.5.1
      # samples/, contrib/ and build/ are excluded in pyproject.toml; the rest
      # of the tree is swept and must stay that way.
      - run: black --check --diff .

  test:
    name: pytest ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One red platform must not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          # The extras row is what exercises the optional integrations: with no
          # pandas_market_calendars installed the trading-calendar test skips
          # itself and nothing says so.
          - { os: ubuntu-latest, python-version: "3.13", extras: "dev,calendars" }
          - { os: ubuntu-latest, python-version: "3.14", extras: "dev" }
          # pyproject.toml claims "Operating System :: OS Independent"; these
          # two rows are what makes that claim checkable.
          - { os: macos-latest, python-version: "3.13", extras: "dev" }
          - { os: windows-latest, python-version: "3.13", extras: "dev" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[${{ matrix.extras }}]"
      - run: pytest -q --durations=10

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev,calendars]"
      # 72% (statements and branches) on 2026-08-24. The floor is a backstop
      # against a silent collapse, not a target; raise it when the real number
      # moves, and record the new one in reports/TESTING_SUITE.md.
      - run: pytest -q --cov --cov-report=term --cov-report=xml --cov-fail-under=70
      - name: coverage summary
        if: always()
        run: |
          total=$(coverage report --format=total 2>/dev/null || echo "?")
          # To a file first: piping straight into head gives coverage a SIGPIPE,
          # and `shell: bash` here means -o pipefail.
          coverage report --skip-covered --sort=cover > report.txt 2>&1 || true
          {
            echo "### Coverage: ${total}% (statements and branches)"
            echo
            echo '```'
            head -n 30 report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: warn

  package:
    name: build and verify artefacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*

      # 2.0.0 shipped an sdist whose tests could not run: setuptools' legacy
      # heuristic matched tests/test*.py and left conftest.py and datas/ out,
      # so every test in the artefact failed at collection. MANIFEST.in fixed
      # it; this is the check that keeps it fixed.
      - name: the sdist carries the suite and its data
        run: |
          mkdir -p build/sdist
          tar -xzf dist/*.tar.gz -C build/sdist --strip-components=1
          missing=""
          for path in tests/conftest.py tests/testcommon.py tests/test_licensing.py \
                      datas/2006-day-001.txt LICENSE MANIFEST.in pyproject.toml \
                      backtrader/version.py; do
            [ -f "build/sdist/$path" ] || missing="$missing $path"
          done
          if [ -n "$missing" ]; then
            echo "::error::the sdist is missing:$missing"
            exit 1
          fi

      - name: neither artefact carries byte-code
        run: |
          python - <<'PY'
          import glob, sys, tarfile, zipfile

          def suspect(names):
              return [n for n in names if n.endswith(".pyc") or "__pycache__/" in n]

          bad = []
          for path in glob.glob("dist/*.whl"):
              bad += suspect(zipfile.ZipFile(path).namelist())
          for path in glob.glob("dist/*.tar.gz"):
              with tarfile.open(path) as tar:
                  bad += suspect(tar.getnames())
          if bad:
              print("::error::byte-code in the artefacts: " + ", ".join(bad[:10]))
              sys.exit(1)
          PY

      - name: the shipped suite passes against the installed sdist
        run: |
          python -m venv .venv-sdist
          .venv-sdist/bin/pip install --quiet --upgrade pip
          .venv-sdist/bin/pip install --quiet dist/*.tar.gz pytest pyflakes
          cd build/sdist
          ../../.venv-sdist/bin/python -m pytest -q

      # The engine declares no runtime dependencies. A stray import that turned
      # an extra into a hard requirement would show up here as a second line.
      - name: the wheel installs alone and its entry point works
        run: |
          venv="$PWD/.venv-wheel"
          python -m venv "$venv"
          "$venv/bin/pip" install --quiet --upgrade pip
          "$venv/bin/pip" install --quiet dist/*.whl
          installed=$("$venv/bin/pip" freeze)
          echo "$installed"
          if [ "$(printf '%s\n' "$installed" | grep -c .)" -ne 1 ]; then
            echo "::error::the wheel pulled in dependencies"
            exit 1
          fi
          # A wheel installed from a local file freezes as "name @ file://...",
          # not "name==version", so compare the name rather than the whole line.
          name=$(printf '%s\n' "$installed" | sed -E 's/[[:space:]]*[@=].*//')
          if [ "$name" != "slim-backtrader" ]; then
            echo "::error::unexpected install: $installed"
            exit 1
          fi
          # Away from the source tree, so it is the installed package importing.
          cd "$(mktemp -d)"
          "$venv/bin/python" -c "import backtrader; print(backtrader.__version__, backtrader.__btversion__)"
          "$venv/bin/btrun" --help > /dev/null

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # One status to require on master, so adding a job above does not mean
  # editing the branch protection rule.
  ci-passed:
    name: CI passed
    if: always()
    needs: [format, test, coverage, package]
    runs-on: ubuntu-latest
    steps:
      - name: every job must have succeeded
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "job results: $results"
          for result in $results; do
            [ "$result" = "success" ] || exit 1
          done
